apiVersion: v1
kind: ServiceAccount
metadata:
  name: minikura-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: minikura-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: minikura-operator-role
subjects:
  - kind: ServiceAccount
    name: minikura-operator
    namespace: minikura
